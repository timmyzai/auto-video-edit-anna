[project]
name = "auto-video-edit-anna"
version = "0.1.0"
description = "Voice/silence classifier that drives an automated Premiere Pro rough cut via MCP"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "silero-vad>=5.1",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
